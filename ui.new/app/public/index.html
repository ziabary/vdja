<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>دستیار هوشمند فارسی</title>
    <link rel="stylesheet" href="css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="fonts/IranSansX/fontiran.css" />
    <style>
      body {
        font-family: "IRANSansX", sans-serif;
        background: #f8f9fa;
      }
      .logo {
        width: 120px;
      }
      .card-icon {
        font-size: 4rem;
        color: #0d6efd;
      }
      .card {
        transition: transform 0.3s;
      }
      .card:hover {
        transform: translateY(-10px);
      }
      h1 {
        font-weight: 900;
      }

      a[disabled]{
        pointer-events: none;
        opacity: 50%;
      }

      @media (max-width: 640px) {
        
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container py-3">
      <div class="text-start mb-5">
        <img src="/img/logo.png" alt="لوگو" class="logo" />
      </div>
      <h1 class="text-center mb-1 text-primary">دستیار هوشمند فارسی</h1>
      <h2 class="text-center mb-3 text-secondary">نسخه آزمایشی</h2>

      <div class="row g-4 justify-content-center">
        <div class="col-md-4">
          <a href="/translate.html" class="text-decoration-none">
            <div class="card text-center shadow-sm h-100 p-4">
              <div class="card-icon mb-3">🌐</div>
              <h4>ترجمه</h4>
              <p class="text-muted">ترجمه متن به/از فارسی با دقت بالا</p>
            </div>
          </a>
        </div>

        <div class="col-md-4">
          <a href="/login.html" class="text-decoration-none">
            <div class="card text-center shadow-sm h-100 p-4">
              <div class="card-icon mb-3">📚</div>
              <h4>چت عمومی و تخصصی</h4>
              <p class="text-muted">چت عمومی یا مبتنی بر فایل‌های شخصی</p>
            </div>
          </a>
        </div>

        <div class="col-md-4">
          <a href="/summarize.html" class="text-decoration-none">
            <div class="card text-center shadow-sm h-100 p-4">
              <div class="card-icon mb-3">📝</div>
              <h4>خلاصه‌سازی</h4>
              <p class="text-muted">خلاصه متون و فایل‌ها با دقت بالا</p>
            </div>
          </a>
        </div>
      </div>
    </div>
