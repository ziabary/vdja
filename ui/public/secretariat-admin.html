<!doctype html>
<html lang="fa" dir="rtl" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مدیریت دبیرخانه هوشمند</title>
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/bootstrap/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="/fonts/IranSansX/fontiran.css">
  <link rel="stylesheet" href="/fonts/fontawesome/active/all.css">
  <link rel="stylesheet" href="/css/app-nav.css">
  <link rel="stylesheet" href="/css/secretariat.css">
</head>
<body data-service="/">
  <main class="container py-4 fa-num">
    <header class="d-flex flex-wrap align-items-center gap-3 mb-4">
      <a href="/" class="d-flex align-items-center flex-shrink-0" aria-label="صفحهٔ اصلی فاپا"><img src="/img/logo-light.png" alt="لوگوی فاپا" class="bi-color secretariat-logo"></a>
      <a class="btn btn-outline-secondary" href="/secretariat" aria-label="بازگشت"><i class="fa-solid fa-arrow-right"></i></a>
      <div class="flex-grow-1"><h1 class="h3 mb-1">مدیریت دبیرخانه هوشمند</h1><p class="text-secondary mb-0">ورود نامه‌ها و مدیریت اتصال سامانه‌ها</p></div>
      <span id="roleBadge" class="badge text-bg-primary"></span>
      <span data-app-services></span>
      <button id="btnToggleDarkMode" class="btn btn-outline-secondary fa-solid fa-moon" type="button" aria-label="تغییر حالت روشن و تاریک" title="تغییر حالت روشن و تاریک"></button>
      <span data-app-account data-service="/" data-login-back="secretariat-admin"></span>
    </header>
    <div id="notice" class="alert d-none" role="status"></div>
    <div id="adminContent" class="d-none">
      <div class="row g-4">
        <section id="uploadPanel" class="col-lg-6"><div class="card p-4 h-100"><h2 class="h5 mb-3">بارگذاری دستی نامه</h2>
          <form id="letterForm" class="d-grid gap-3">
            <input class="form-control" name="subject" placeholder="موضوع نامه *" required maxlength="500">
            <div class="row g-2"><div class="col"><input class="form-control" name="number" placeholder="شماره نامه"></div><div class="col"><input class="form-control" name="letterDate" placeholder="تاریخ نامه"></div></div>
            <div class="row g-2"><div class="col"><input class="form-control" name="sender" placeholder="فرستنده"></div><div class="col"><input class="form-control" name="recipient" placeholder="گیرنده"></div></div>
            <textarea class="form-control" name="body" rows="5" placeholder="متن نامه، در صورت وجود"></textarea>
            <label class="form-label mb-0">فایل نامه و پیوست‌ها <small class="text-secondary">TXT، MD، DOC، DOCX، ODT یا PDF متنی</small><input class="form-control mt-2" name="files" type="file" multiple accept=".txt,.md,.doc,.docx,.odt,.pdf"></label>
            <label class="form-check"><input class="form-check-input" name="confidential" type="checkbox"><span class="form-check-label">این نامه محرمانه است</span></label>
            <button class="btn btn-primary" type="submit">ثبت و نمایه‌سازی</button>
          </form>
        </div></section>
        <section id="sourcesPanel" class="col-lg-6"><div class="card p-4 h-100"><h2 class="h5 mb-3">منابع دبیرخانه</h2>
          <form id="sourceForm" class="d-grid gap-3 mb-4">
            <input class="form-control" name="name" placeholder="نام سامانه *" required>
            <select class="form-select" name="kind"><option value="rest">REST API</option><option value="pgsql">PostgreSQL</option><option value="mysql">MySQL</option><option value="mssql">SQL Server</option></select>
            <div id="restConfig" class="d-grid gap-3"><input class="form-control" name="url" type="url" placeholder="آدرس API نامه‌ها *" required><input class="form-control" name="tokenEnv" placeholder="نام متغیر محیطی توکن، در صورت نیاز" dir="ltr"></div>
            <div id="dbConfig" class="d-none row g-2">
              <div class="col-8"><input class="form-control" name="host" placeholder="میزبان"></div><div class="col-4"><input class="form-control" name="port" type="number" placeholder="درگاه"></div>
              <div class="col-6"><input class="form-control" name="database" placeholder="نام پایگاه داده"></div><div class="col-6"><input class="form-control" name="user" placeholder="نام کاربر"></div>
              <div class="col-12"><input class="form-control" name="passwordEnv" placeholder="نام متغیر محیطی رمز" dir="ltr"></div>
              <div class="col-6"><input class="form-control" name="table" placeholder="نام جدول"></div><div class="col-6"><input class="form-control" name="idColumn" placeholder="ستون شناسه یکتا"></div>
              <div class="col-6"><input class="form-control" name="subjectColumn" placeholder="ستون موضوع"></div><div class="col-6"><input class="form-control" name="bodyColumn" placeholder="ستون متن نامه"></div>
              <div class="col-6"><input class="form-control" name="numberColumn" placeholder="ستون شماره، اختیاری"></div><div class="col-6"><input class="form-control" name="dateColumn" placeholder="ستون تاریخ، اختیاری"></div>
              <div class="col-6"><input class="form-control" name="senderColumn" placeholder="ستون فرستنده، اختیاری"></div><div class="col-6"><input class="form-control" name="recipientColumn" placeholder="ستون گیرنده، اختیاری"></div>
            </div>
            <label class="form-check"><input class="form-check-input" name="enabled" type="checkbox"><span class="form-check-label">اتصال فعال باشد</span></label>
            <button class="btn btn-outline-primary" type="submit">افزودن منبع</button>
          </form>
          <div id="sources" class="d-grid gap-2"></div>
        </div></section>
      </div>
      <section id="wizardPanel" class="admin-panel mt-4 d-none">
        <h2 class="h5">مدیریت نامه‌ها</h2>
        <ul class="nav nav-tabs mt-3" role="tablist">
          <li id="wizardUploadNav" class="nav-item d-none" role="presentation"><button id="wizardUploadTab" class="nav-link" type="button" data-bs-toggle="tab" data-bs-target="#wizardUploadPane" role="tab" aria-controls="wizardUploadPane" aria-selected="false">بارگذاری فایل‌ها</button></li>
          <li class="nav-item" role="presentation"><button id="wizardListTab" class="nav-link active" type="button" data-bs-toggle="tab" data-bs-target="#wizardListPane" role="tab" aria-controls="wizardListPane" aria-selected="true">همهٔ نامه‌ها <span id="wizardCount" class="badge text-bg-secondary ms-1"></span></button></li>
        </ul>
        <div class="tab-content pt-3">
          <div id="wizardUploadPane" class="tab-pane fade" role="tabpanel" aria-labelledby="wizardUploadTab" tabindex="0">
            <p class="text-secondary">برای هر فایل یکتا یک نامه با شمارهٔ تصادفی ساخته می‌شود. حداکثر ۱۰٪ نامه‌های موفق به صورت تصادفی محرمانه می‌شوند.</p>
            <form id="wizardForm" class="d-grid gap-3">
              <input class="form-control" type="file" name="files" multiple required accept=".txt,.md,.doc,.docx,.odt,.pdf">
              <button class="btn btn-primary" type="submit">ساخت نامه‌ها و نمایه‌سازی</button>
            </form>
          </div>
          <div id="wizardListPane" class="tab-pane fade show active" role="tabpanel" aria-labelledby="wizardListTab" tabindex="0">
            <div id="wizardResults" role="status"></div>
            <div class="table-responsive"><table class="table table-hover align-middle mb-0">
              <thead><tr><th scope="col">نامه</th><th scope="col">فایل و پیوست</th><th scope="col">وضعیت</th><th scope="col">عملیات</th></tr></thead>
              <tbody id="wizardLetters"><tr><td colspan="4" class="text-secondary">در حال بارگذاری…</td></tr></tbody>
            </table></div>
            <nav class="d-flex flex-wrap justify-content-center align-items-center gap-3 mt-3" aria-label="صفحه‌بندی نامه‌ها">
              <button id="lettersPrevious" class="btn btn-outline-secondary" type="button" disabled>صفحهٔ قبل</button>
              <span id="lettersPage" class="text-secondary fa-num" aria-live="polite">صفحهٔ 1 از 1</span>
              <button id="lettersNext" class="btn btn-outline-secondary" type="button" disabled>صفحهٔ بعد</button>
            </nav>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script>window.page = { serviceName: '/' };</script>
  <script src="/js/vendors/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app-nav.js"></script>
  <script src="/js/secretariat-admin.js"></script>
</body>
</html>
