<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>چت با تفکر - دستیار هوشمند فارسی</title>
    
    <link rel="stylesheet" href="css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="fonts/IranSansX/fontiran.css" />
    <link rel="stylesheet" href="fonts/fontawesome/active/all.css" />

    <script src="js/marked.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .chat-container {
        height: 80vh;
        overflow-y: auto;
      }
      pre{
        direction: ltr;
        text-align: left;
      }
      .message {
        margin-bottom: 1rem;
        padding: 0.5rem;
        border-radius: 0.5rem;
      }
      .user-message {
        background: #0d6efd;
        color: white;
        margin-right: 10%;
        text-align: left;
      }
      .bot-message {
        background: #f8f9fa;
        color: #333;
        margin-left: 10%;
        text-align: left;
      }
      .sidebar {
        direction: ltr;
        position: fixed;
        left: 0;
        top: 0;
        width: 350px;
        height: 100vh;
        background: white;
        box-shadow: -2px 0 10px rgba(0, 0, 0, 0.1);
        overflow-y: auto;
        z-index: 1000;
      }
      .main-chat {
        margin-left: 350px;
        padding: 20px;
        position: relative;
        height: 100vh;
        direction: ltr;
        text-align: left;
      }
      .file-item,
      .chat-item { 
        cursor: pointer;
        padding: 0.5rem;
        border-bottom: 1px solid #eee;
        position: relative;
        color: darkgray;
      }
      .file-item:hover,
      .chat-item:hover {
        background: #f8f9fa;
      }
      .modal-footer button {
       font-size: 0.8em;
      }
      .delete-btn {
        font-size: 0.8rem;
        color: #dc3545;
        position: absolute;
        font-size: 0.5em;
        padding: 0.2em 0.6em;
        right: 4px;
      }
      think{
        color: gray;
        font-size: 90%;
        margin-bottom: 1em;
        display: block;
      }
      #backToLogin {
          position: absolute;
          top: 1em;
          left: 1em;
          font-size: 0.8rem;
      }
      #inpUpload {
        display: none;
      }
      .rtl {
        direction: rtl;
        text-align: justify;
      }
      .ltr {
        direction: ltr;
        text-align: left;
      }
      .logo {
        height: 2rem;
        text-align: right;
        margin-bottom: 2rem;
      }
      .logo img {
        height: 100%;
      }
      .thinking {
        opacity: 0.8;
        font-style: italic;
      }

      .dots {
        display: inline-block;
        width: 20px;
        text-align: left;
      }

      .navbar, .close-sidebar-cross {
        display: none;
      }
      .push-bottom {
        position: absolute;
        bottom: 1em;
        width: 100%;
        text-align: center;
      }

      #chatsList, #filesList{
        padding-right: 0.5em;
        font-size: 0.8em;
      }
      .empty {
        color: gray;
        padding: .5rem;
      }

      .new-chat .chat-header, 
      .new-chat .chat-container{
        display: none;
      }
      .chat-helper { display: none; font-size: 70%; }
      .chat-helper h5 {line-height: 1.5em;}
      .new-chat .chat-helper {display: block;}

      #messageInput{
        resize: none; z-index: 0;
        max-height: 90px;
        height: 80px;
      }

      .new-chat #messageInput{
        border-radius: 2em;
        height: 50px;
        max-height: 400px; /* Set your maximum height */
        overflow: auto;
      }
      .new-chat .message-input{
        width: 70%;
        margin: auto;
        position: absolute;
        top:50%;
        left:50%;
        transform: translate(-50%, -50%);
      }

      .new-chat #messageInput::placeholder,
      .message-buttons {
        position: absolute;
        bottom: 50%;
        right: 0;
        z-index: 2;
        transform: translateY(50%);
      }
      .new-chat #messageInput::placeholder{
        left: 1em;
      }

      .message-buttons button:hover,
      .message-buttons label:hover { 
        border: 1px solid; 
        background-color: gray; 
        color: white;
      }

      .burger, .close-sidebar-cross{width: 24px; z-index:20000; cursor: pointer; pointer-events: all;}

      .fa-reverse{ transform: rotate(180deg); }


      @media (max-width: 640px) {
        .sidebar {
          right: -350px;
          transition: ease-in 0.2s;
        }

        .navbar {
          display: block;
        }
        .chat-container {
          height: calc(80vh - 64px);
        }

        body.side-open .sidebar {
          right: 0;
        }
        body.side-open .close-sidebar-cross {
          display: block;
        }
        body.side-open .burger {
          display: none;
        }

        .main-chat {
          margin-right: unset;
          margin-top: 64px;
        }
        h4#currentChatTitle {
            font-size: 1rem;
            font-weight: 800;
        }
        .new-chat .message-input{
          width: calc(100% - 2em);
        }
      }
    </style>
  </head>
  <body class="new-chat">

        <span class="close-sidebar-cross" onclick="document.body.classList.remove('side-open')"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="--color: inherit; --transform: none;"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path></svg></span>

      <div class="logo">

      <h5 class="mb-3 mt-2">

    <div class="main-chat">

    <div class="modal fade" id="editTitleModal" tabindex="-1">

    <script src="js/vendors/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <!-- MathJax -->
    <script src="js/vendors/mathjax/config.js"></script>
    <script src="js/vendors//polyfill.min.js?features=es6"></script>
    <script src="js/vendors/mathjax/es5/tex-mml-chtml.js"></script>

    <script>
      const userKey = sessionStorage.getItem("user_key");
      if (!userKey || userKey.length < 16) {
        showError("لطفاً ابتدا وارد شوید.");
        window.location.href = "/login.html?back=think.html";
        throw new Error("No user key");
      }
      let currentChatId = location.hash.replace("#",'') || undefined;
      let chatHistory = [];
      let useFiles = true;

      const editHelp = `<small class="text-muted ms-2" style="font-size: 0.5em;">(click to edit)</small>`
      const chatsList = document.getElementById("chatsList");
      const chatContainer = document.getElementById("chatContainer");
      const messageInput = document.getElementById("messageInput");
      const currentChatTitle = document.getElementById("currentChatTitle");
      const btnNewChat = document.getElementById("btnNewChat");
      const btnDeleteAllChats = document.getElementById("btnDeleteAllChats");
      const backToLogin = document.getElementById("backToLogin");
      const chatHelper = document.getElementById("chat-helper-container")
      const titleCache = new Map();
      
      const sampleMessages = [
        "What is the problem with this code?",
      ]

      /*********************************/
      function autoQuery(text){
        messageInput.value = text
        sendMessage()
      }

      /*********************************/
      function appendMessage(role, content) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${
          role === "user" ? "user-message" : "bot-message"
        }`;
        if (role === "user") {
          msgDiv.innerHTML = content.replace(/\r?\n/g, "<br/>");
          setTimeout(()=>window.MathJax.typesetPromise([msgDiv]))
        } else {
          prettyShowResponse(content, msgDiv)
        }
        chatContainer.appendChild(msgDiv);
      }

      /*********************************/
      function addHelpItem(html){
        const div = document.createElement("div"); div.classList.add("btn", "btn-outline-secondary", "m-1")
        div.innerHTML = html
        div.onclick = ()=>autoQuery(html)
        chatHelper.appendChild(div)
      }

      /*********************************/
      function updateQuestions(questions, filesEnabled){
        const chatBanner = document.querySelector(".chat-helper h5")

        chatHelper.innerHTML = ""
        sampleMessages.sort((a,b)=>Math.random()>.5 ? -1 : 1).slice(0, 5).forEach(addHelpItem)
        addHelpItem("Help please!!!")
      }

      /*********************************/
      function setCurrChatId(chatId) {
            location.hash = chatId
            currentChatId = chatId;
      }
      /*********************************/
      let titleEditModal = null;
      document.getElementById("currentChatTitle").onclick = () => {
        if (!currentChatId) return;

        titleEditModal = new bootstrap.Modal(document.getElementById("editTitleModal"));
        document.getElementById("newTitleInput").value =
          currentChatTitle.innerHTML.replace(editHelp, '').trim();
        titleEditModal.show();
      };

      document
        .getElementById("saveTitleBtn")
        .addEventListener("click", async () => {
          const newTitle = document
            .getElementById("newTitleInput")
            .value.trim();
          if (!newTitle || newTitle === currentChatTitle.innerHTML.trim()) {
            titleEditModal.hide();
            return;
          }

          const res = await apiFetch("/api/think/chat/title", {
            method: "PUT",
            body: JSON.stringify({
              user_key: userKey,
              chat_id: currentChatId,
              title: newTitle,
            }),
          });

          if (res.ok) {
            currentChatTitle.innerHTML =
              newTitle +
              editHelp;
            toast("عنوان چت به‌روزرسانی شد", "success");
            loadChats();
          } else {
            toast("خطا در تغییر عنوان", "danger");
          }
          titleEditModal.hide();
        });

      /*********************************/
      function disableInputs(state)   {
        messageInput.disabled = state;
      }

      /*************************************/
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      /*********************************/
      const enuStates = {
        newChat : 'newChat',
        chatStarted: 'chatStarted',
        chatContinues: 'chatContinues',
      }

      async function updateAppState(state) {
          switch(state) {
            case enuStates.newChat:
              currentChatTitle.innerHTML = "چت متفکرانه با ترگمان"
              document.body.classList.add('new-chat')
              chatHistory = [];
              chatContainer.innerHTML = "";
              btnNewChat.setAttribute('disabled', true)
              document.body.classList.remove('side-open')
              setCurrChatId('')
              messageInput.focus()
              break;
            case enuStates.chatStarted:
              chatHistory = [];
              chatContainer.innerHTML = "";
            case enuStates.chatContinues:
              document.body.classList.remove('side-open')
              btnNewChat.removeAttribute('disabled')
              document.body.classList.remove('new-chat')
              messageInput.focus()
              messageInput.height = '80px'
          }
          const questions = await loadChats();
          updateQuestions(questions)
      }

      /*********************************/
      async function loadChats() {
        const res = await fetch(`/api/think/chats?user_key=${userKey}`);
        const { chats, questions } = await res.json();
        chatsList.innerHTML = chats
          .map(
            (chat) => `
              <div class="chat-item ${
                currentChatId === chat.chat_id ? "bg-primary text-white" : ""
              }" onclick="loadChat('${chat.chat_id}', '${chat.title}')">
                ${chat.title} <small class="d-inline-block">${new Date(
              chat.last_message_at
            ).toLocaleDateString("fa-IR")}</small>
                <button class="delete-btn btn btn-outline-danger float-end" onclick="deleteChat('${
                  chat.chat_id
                }', event)"><i class="fa fa-remove"></i></button>
              </div>
            `
          )
          .join("") || '<div class="empty">هنوز هیچ چتی نداشته‌اید</div>'

          if(chats.length) 
              btnDeleteAllChats.removeAttribute('disabled')
          else 
              btnDeleteAllChats.setAttribute('disabled', true)
          return questions
      }

      /*************************************/
      async function loadChat(chatId, chatTitle) {
        currentChatId = chatId;
        currentChatTitle.innerHTML = "Loading...";
        chatContainer.innerHTML = ""

        try {
          const res = await fetch(
            `/api/think/chat/${chatId}/messages?user_key=${userKey}`
          );
          if (!res.ok) {
            if(res.status == 403) 
              return await updateAppState(enuStates.newChat)()

            toast("خطا در بارگذاری چت", "danger");
            return await updateAppState(enuStates.newChat)();
          }
          
          const { messages, chatTitle } = await res.json();
          if(!chatTitle) return await updateAppState(enuStates.newChat)()

          chatHistory = messages.map((m) => ({
            role: m.role,
            content: m.content,
          }));
          messages.forEach((m) => appendMessage(m.role, m.content.startsWith('AUTO_SUMMARY: ') ? 'Summary of old conversation' : m.content));
          chatContainer.scrollTop = chatContainer.scrollHeight;
          currentChatTitle.innerHTML = chatTitle + editHelp
          location.hash = chatId
          await updateAppState(enuStates.chatContinues)
        } catch (err) {
          console.error(err);
          toast("خطا در ارتباط", "danger");
        }
      }
      /*************************************/
      function prettyShowResponse(fullResponse, botMessageWrapper){
          botMessageWrapper.innerHTML = ''
          const botMsg = document.createElement("div"); botMsg.className = "bot-text";
          botMessageWrapper.appendChild(botMsg);

          const sourceEl = document.createElement("div");
          sourceEl.className = "source-info text-muted small mt-2 fa-num";
          sourceEl.style.display = "none";
          botMessageWrapper.appendChild(sourceEl);

          let mainAnswer = fullResponse//  fullResponse.trim().replace(/\n\*?\*?عبارات کلیدی:\*?\*?[\n ](.*,?)+\n/, '')

          botMsg.innerHTML = marked.parse(mainAnswer);
          setTimeout(()=>window.MathJax.typesetPromise([botMsg]))
          sourceEl.style.display = "none";
      }
      /*************************************/
      async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        if (!currentChatId) {
          try {
            const res = await fetch("/api/think/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ user_key: userKey }),
            });
            if (!res.ok) {
              toast("خطا در ساخت چت جدید", "danger");
              return;
            }
            const { chat_id } = await res.json();
            await updateAppState(enuStates.newChat)
            setCurrChatId(chat_id)
          } catch (err) {
            console.error(err);
            toast("خطا در ساخت چت جدید", "danger");
            return;
          }
        }
        await updateAppState(enuStates.chatContinues)
        appendMessage("user", message);

        const botMessageWrapper = document.createElement("div");
        botMessageWrapper.className = "message bot-message";
        botMessageWrapper.id = "botResponseWrapper";

        const botMsg = document.createElement("div"); botMsg.className = "bot-text";

        botMsg.innerHTML = `
          <span class="thinking">thinking</span>
          <span class="dots">...</span>
        `;

        botMessageWrapper.appendChild(botMsg);

        chatContainer.appendChild(botMessageWrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        let dotCount = 0;
        let dotInterval = setInterval(() => {
          dotCount = (dotCount + 1) % 4;
          const dotsEl = botMsg.querySelector(".dots");
          if (dotsEl) dotsEl.textContent = ".".repeat(dotCount);
        }, 400);

        messageInput.value = "";

        let fullResponse = "";
        let attempts = 0;
        const maxAttempts = 3;

        disableInputs(true)
        while (attempts < maxAttempts) {
          attempts++;
          try {
            const res = await fetch("/api/think/chat-message", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                user_key: userKey,
                message,
                chat_id: currentChatId,
                use_files : useFiles
              }),
            });

            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              throw new Error(err.error || "خطای سرور");
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            fullResponse = "";

            let streamCompleted = false;
            while (true) {
              const { done, value } = await reader.read();
              if (done) {
                streamCompleted = true;
                break;
              }

              const chunk = decoder.decode(value, { stream: true });
              const lines = chunk
                .split("\n")
                .filter((l) => l.startsWith("data: "));

              for (const line of lines) {
                if (line.startsWith("[RAG ERROR]: ")){toast(line.replace("[RAG ERROR]: ", ""), "danger")}
                if (line === "data: [DONE]") continue;
                if (line === "data: [summarizing]") {document.querySelector(".bot-text .thinking").innerText = "Summarizing old chats"; continue};
                if (line === "data: [re-thinking]") {document.querySelector(".bot-text .thinking").innerText = "re-thinking"; continue};
                try {
                  const json = JSON.parse(line.slice(6));
                  const token = json.choices[0].delta.content || "";
                  fullResponse += token;

                  const safeResponse = fullResponse
//                    .replace(/</g, "&lt;")
//                    .replace(/>/g, "&gt;");
                  botMsg.innerHTML = marked.parse(safeResponse);
                  window.MathJax.typesetPromise([botMsg])
                  chatContainer.scrollTop = chatContainer.scrollHeight;
                } catch (e) {
                  // نادیده گرفتن خطاهای جزئی JSON
                }
              }
            }

            if (streamCompleted) {
              prettyShowResponse(fullResponse, botMessageWrapper)

              chatHistory.push({ role: "user", content: message });
              chatHistory.push({
                role: "assistant",
                content: fullResponse,
              });

              if (chatHistory.length > 1 && chatHistory.length <= 4) 
                await generateChatTitle(chatHistory);

              if (currentChatId) {
                fetch("/api/think/chat", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    user_key: userKey,
                    chat_id: currentChatId,
                  }),
                });
              }
              clearInterval(dotInterval);
              disableInputs(false)
              messageInput.focus()
              return;
            }
          } catch (err) {
            console.warn(`تلاش ${attempts} ناموفق:`, err);
            if (attempts < maxAttempts) {
              toast(
                `اتصال قطع شد، تلاش مجدد ${attempts + 1} از ${maxAttempts}...`,
                "warning"
              );
              fullResponse = "";
              botMsg.innerHTML = "";
              botMsg.innerHTML = `
                <span class="thinking">در حال تلاش مجدد</span>
                <span class="dots">...</span>
              `;
              // ری‌استارت انیمیشن
              dotCount = 0;
              clearInterval(dotInterval);
              dotInterval = setInterval(() => {
                dotCount = (dotCount + 1) % 4;
                const dotsEl = botMsg.querySelector(".dots");
                if (dotsEl) dotsEl.textContent = ".".repeat(dotCount);
              }, 400);
              await new Promise((resolve) => setTimeout(resolve, 1500));
            }
          }
        }

        clearInterval(dotInterval);
        botMsg.innerHTML = marked.parse(
          "Unable to get response after several tries."
        );
        toast("خطا در ارتباط با سرور", "danger");
        disableInputs(false)
      }

      /*************************************/
      async function generateChatTitle(chatHistory) {
        const firstDialog = chatHistory.map(cht=>cht.content).join("\n")
        const cacheKey = `${currentChatId}-${firstDialog.substring(0, 1000)}`;
        if (titleCache.has(cacheKey)) {
          const cachedTitle = titleCache.get(cacheKey);
          if (cachedTitle && cachedTitle.trim() !== "New chat") {
            currentChatTitle.innerHTML =
              cachedTitle.trim() + editHelp
            return;
          }
        }
        try {
          const res = await fetch("/api/think/generate-title", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              user_key: userKey,
              chat_id: currentChatId,
              first_message: firstDialog,
            }),
          });

          if (res.ok) {
            const { title, fullTitle } = await res.json();
            titleCache.set(cacheKey, title);
            if (title && title.trim() && title.trim() !==  "New chat") {
              currentChatTitle.innerHTML =
                title.trim() + editHelp
              loadChats();
            }
          }
        } catch (err) {
          console.error("خطا در تولید عنوان:", err);
        }
      }
      
      /*************************************/
      async function deleteChat(chatId, event) {
        event.stopPropagation();

        const result = await confirmDialog({
          title: "حذف چت",
          message: "آیا از حذف این چت مطمئن هستید؟",
          confirmText: "بله، حذف کن",
          confirmClass: "btn-danger",
        });

        if (!result.confirmed) return;

        const res = await fetch(`/api/think/chat/${chatId}`, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_key: userKey }),
        });

        if (res.ok) {
          toast("چت حذف شد", "info");
          if (currentChatId === chatId) 
            await updateAppState(enuStates.newChat)
        }
      }

      /*************************************/
      btnDeleteAllChats.addEventListener("click", async () => {
        const result = await confirmDialog({
          title: "حذف همه چت‌ها",
          message: "همه چت‌های شما حذف خواهند شد. ادامه می‌دهید؟",
          confirmText: "بله، همه را حذف کن",
          confirmClass: "btn-danger",
        });

        if (!result.confirmed) return;

        const res = await fetch("/api/think/chats", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_key: userKey }),
        });

        if (res.ok) {
          toast("همه چت‌ها حذف شدند", "info");
          await updateAppState(enuStates.newChat)
        }
      });

      /*************************************/
      btnNewChat.addEventListener("click", async () => {
        document.body.classList.remove('side-open')
        messageInput.style.height = '50px'
        await updateAppState(enuStates.newChat)
      });

      /*************************************/
      sendBtn.addEventListener("click", sendMessage);
      messageInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && e.shiftKey == false && e.ctrlKey == false && e.altKey == false) sendMessage();
      });
      function autoResize(ev) {
        textarea = ev.target
        textarea.style.height = 'auto';
        const newHeight = Math.min(textarea.scrollHeight, 400);
        textarea.style.height = newHeight + 'px';
      }

      messageInput.addEventListener('input', autoResize);

      backToLogin.addEventListener("click",async () => {
        const result = await confirmDialog({
          title: "خروج از حساب",
          message: "آیا می‌خواهید از حساب خود خارج شوید؟",
          confirmText: "بله، خارج شو",
          confirmClass: "btn-outline-danger",
        });

        if (result.confirmed) {
          sessionStorage.removeItem("user_key");
          window.location.href = "/";
        }
      } );

      if (currentChatId) setTimeout(()=>loadChat(currentChatId), 100);
      else updateAppState(enuStates.newChat); 
    </script>
  </body>
</html>
