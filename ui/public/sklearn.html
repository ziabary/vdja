<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>راهنمای scikit - دستیار هوشمند فارسی</title>
  <link rel="stylesheet" href="css/bootstrap/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="fonts/IranSansX/fontiran.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/app-nav.css" />
  <link rel="stylesheet" href="fonts/fontawesome/active/all.css" />

  <style>
    iframe{
        width: 100%;
        min-height: calc(100vh - 5em);
    }
    .main.container {
        max-width: 100%;
            margin-top: 4em;
    }
  </style>
</head>

<body data-service="sklearn">
  <span id="loading">
    <div class=marquee></div>
  </span>

    <!-- NAVBAR + MENU -->
    <nav class="navbar shadow-sm" id="navbar">
      <div class="container" style="max-width: 100%;">
          <img src="/img/logo-light.png" alt="لوگو" class="bi-color logo" />

          <span class="navbar-brand mx-auto h4 mb-0">راهنمای scikit</span>

          <div class="left-side mx-2">
              <i class="btn btn-sm fa fa-moon fa-lg btn" id=btnToggleDarkMode></i>
              <div class="on-mobile" title="منو"><i class="btn btn-sm fa fa-lg fa-bars" id="btnMenu"></i></div>
              <div class="on-desktop d-flex gap-2">
          <span data-app-services></span>
          <span data-app-account data-service="sklearn" data-login-back="sklearn"></span>
        </div>
      </div>
    </div>
  </nav>
  <div class="collapsed" id="menu">
    <span data-app-services></span>
    <span data-app-account data-service="sklearn" data-login-back="sklearn"></span>
  </div>

  <!-- CONTAINER -->
  <div class="main container">
    <iframe src="https://sklearn.targoman.ir/"></iframe>
  </div>
  <script src="js/vendors/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app-nav.js"></script>
  <script>let auth; setupAuth("sklearn", false).then(r => auth = r)</script>
</body>

</html>
