<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بررسی گفتگوی کاربر - دستیار هوشمند فارسی</title>
  <link rel="stylesheet" href="css/bootstrap/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="fonts/IranSansX/fontiran.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="fonts/fontawesome/active/all.css" />

  <style>
    .table-container {
      max-height: 80vh;
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <span id="loading">
    <div class=marquee></div>
  </span>

  <nav class="navbar shadow-sm">
    <div class="container">
      <img src="/img/logo-light.png" alt="لوگو" class="bi-color logo me-3" />
      <span class="navbar-brand mx-auto h4 mb-0">گزارش گفتگو</span>
      <a href="/" class="btn btn-outline-primary">← بازگشت به خانه</a>
    </div>
    <div class="left-side">
      <i class="fa fa-moon fa-lg btn" id=btnToggleDarkMode></i>
      <a href="/login?back=conv" class="btn btn-outline-primary" id=btnLogin>ورود به سامانه</a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card shadow">
      <div class="card-body p-4">
        <h3 class="text-danger text-center" id="isRemoved"></h3>
        <div class="table-responsive table-container">
          <table class="table table-hover table-bordered align-middle text-center fa-num">
            <thead class="table-light sticky-top">
              <tr>
                <th>ردیف</th>
                <th>پیام</th>
                <th>نظر</th>
                <th>زمان</th>
                <th>اپراتور</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="4" class="text-muted">در حال بارگذاری...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/vendors/marked.min.js"></script>
  <script src="js/vendors/bootstrap.bundle.min.js"></script>
  <script src="js/vendors/mathjax/config.js"></script>
  <script src="js/vendors/polyfill.min.js?features=es6"></script>
  <script src="js/vendors/mathjax/es5/tex-mml-chtml.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>

  <script>
    const queries = parseQuery(window.location.search)

    setupAuth("conv", true).then(r => {
      auth = r

      const tbody = document.querySelector("tbody")
      auth.apiFetch(`/api/admin/conversation/?service=${queries.service}&id=${queries.id}`)
        .then(async res => {
          if (!res.ok) throw new Error("دسترسی ممنوع یا خطا در سرور");
          const data = await res.json()

          tbody.innerHTML = ""
          
          document.getElementById("isRemoved").innerHTML = data.chat.chtStatus === "Removed" ? "این چت حذف شده" : ""
          data.messages.forEach((msg, index) => {
            const { msgCreatedAt, msgOpinion, msgRole, msgContent } = msg
            const created = new Date(msgCreatedAt).toLocaleString("fa-IR", {timeZone: "GMT"});
            const opinion = `<i class="fa fa-solid fa-${msgOpinion === 'u' ? 'thumbs-up text-success' : msgOpinion === 'd' ? 'thumbs-down text-danger' : msgOpinion === 'w' ? 'warning text-warning' : '-'}"></i>`
            tbody.innerHTML += `
              <td>${index}</td>
              <td style="text-align: right">${marked.parse(msgContent)}</td>
              <td>${opinion}</td>
              <td>${created}</td>
              <td>${msgRole}</td>
            `
          })
          setTimeout(() => window.MathJax.typesetPromise([tbody]))
        }).catch(e=> tbody.innerHTML = `<td colspan=5>${e.message}</td>`);
    })

  </script>
</body>

</html>
